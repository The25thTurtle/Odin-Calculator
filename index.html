<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Calculator</title>
        <link rel="stylesheet" href="style.css">
        <script src="index.js" defer></script>
    </head>
    <body>
        <main>
            <div class="container">
                <section>
                    <div class="display">
                        <span id="results"></span>
                    </div>
                </section>
                <section class="pad">
                    <button class="numbers">7</button>
                    <button class="numbers">8</button>
                    <button class="numbers">9</button>
                    <button id="divide" class="operators">/</button>
                    <button class="numbers">4</button>
                    <button class="numbers">5</button>
                    <button class="numbers">6</button>
                    <button id="multi" class="operators">*</button>
                    <button class="numbers">1</button>
                    <button class="numbers">2</button>
                    <button class="numbers">3</button>
                    <button id="sub" class="operators">-</button>
                    <button class="numbers">0</button>
                    <button class="numbers">.</button>
                    <button class="equal">=</button>
                    <button id="add" class="operators">+</button>
                    <button class="clear">C</button>
                </section>
            </div>
        </main>
    </body>
</html>
